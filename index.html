<!DOCTYPE html>
<html lang="en">
<head>

<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header / Navbar -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 p-2 rounded-lg text-white font-bold text-xl">
                    ✨
                </div>
                <span class="text-xl font-bold bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">
                    SmartText
                </span>
                <span class="text-xs bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 px-2 py-0.5 rounded-full">v1.0</span>
            </div>
            <button onclick="scrollToApp()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-sm px-4 py-2 rounded-lg transition font-medium">
                Get Started
            </button>
        </div>
    </header>

    <!-- Top Banner Ad Placeholder -->
    <div class="max-w-6xl mx-auto px-4 w-full mt-4">
        <div class="bg-slate-800/50 border border-dashed border-slate-700 rounded-xl p-4 text-center text-xs text-slate-500">
            Ad Space (Top Banner) - Reserved for Google AdSense
        </div>
    </div>

    <!-- Hero Section -->
    <section class="max-w-4xl mx-auto px-4 py-12 text-center">
        <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight mb-4 bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
            Efficient Online <span class="text-indigo-400">Text Processing</span> & Automation
        </h1>
        <p class="text-slate-400 text-base md:text-lg max-w-2xl mx-auto">
            Designed for developers, copywriters, and data analysts. 100% client-side execution ensures your data never touches a server for complete privacy.
        </p>
    </section>

    <!-- Main Application Box -->
    <main id="app" class="max-w-6xl mx-auto px-4 mb-16 w-full flex-grow">
        <div class="bg-slate-800/40 border border-slate-800 rounded-2xl p-4 md:p-6 shadow-xl backdrop-blur-sm">
            
            <!-- Navigation Tabs -->
            <div class="flex border-b border-slate-700 space-x-6 mb-6 overflow-x-auto text-sm font-medium">
                <button onclick="switchTab('clean')" id="tab-clean" class="pb-3 text-slate-400 hover:text-slate-200 transition flex items-center space-x-2 whitespace-nowrap active-tab">
                    <span>🧹 Text Cleaning & Deduplication</span>
                </button>
